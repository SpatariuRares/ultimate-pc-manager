[package]
name = "ultimate-pc-manager"
version = "0.3.2"
edition = "2021"

[[bin]]
name = "ultimate-pc-manager"
path = "src/main.rs"

[dependencies]
eframe = "0.33"
egui = "0.33"
egui_extras = "0.33"
sysinfo = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Benchmarks' Internet test (HTTPS to speed.cloudflare.com): blocking client,
# rustls with Mozilla's roots; no gzip, cookies or JSON.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Already under ureq: named only to tell certificate errors apart.
rustls = { version = "0.23", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# GPU benchmark: wgpu with the native backend of the system (Direct3D 12).
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Power",
    "Win32_System_Time",
    "Win32_Security",
    # WinVerifyTrust and catalogs: who signed a program file.
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    # Filter Manager: the loaded file-system minifilters (read-only).
    "Win32_Storage_InstallableFileSystems",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    # Wait Chain Traversal (Analyze wait chain).
    "Win32_System_Diagnostics_Debug",
    # Processes › File activity: a real-time ETW session on Kernel-File.
    "Win32_System_Diagnostics_Etw",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# GPU benchmark: wgpu on Vulkan.
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
# GPU benchmark: wgpu on Metal.
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
