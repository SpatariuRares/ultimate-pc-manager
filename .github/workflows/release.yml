name: Release

# Runs only when a v* tag is pushed: one build, no tests (CI ran them on the PR).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          # The exe is named as the app, so a shortcut to it reads "Ultimate PC Manager".
          Copy-Item target/release/ultimate-pc-manager.exe "Ultimate PC Manager.exe"
          Compress-Archive -Path "Ultimate PC Manager.exe", README.md, assets/Michroma-OFL.txt, assets/Selawik-OFL.txt -DestinationPath UltimatePCManager.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: UltimatePCManager.zip
